# Every push and pull request: formatting, lints, the tests, the build
# without the optional evdev feature, and a look at the plugin files. None
# of it needs a display or Hyprland.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --no-default-features
      - name: Plugin manifest and plugin sources
        run: |
          python3 - <<'EOF'
          import json, os, sys
          m = json.load(open("manifest.json"))
          assert m["kinds"] == ["service", "panel"], m["kinds"]
          assert os.path.isfile(m["entryPoints"]["service"]) and os.path.isfile(m["entryPoints"]["panel"])
          print(m["id"], m["version"])
          EOF
          for d in plugins/*/; do
            test -f "$d/init.lua" && test -f "$d/README.md" || { echo "incomplete plugin $d"; exit 1; }
          done
